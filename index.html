<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Chinois · Pinyin</title>
  <meta name="description" content="Chinois pour les élèves du cours : la prononciation du pinyin et les caractères des mots du cours, chacun à son rythme.">
  <meta name="theme-color" content="#1f5f8b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Chinois">
  <link rel="apple-touch-icon" href="icone-180.png">
  <link rel="manifest" href="manifest.json">
  <script>
  // Le site s'ouvre sur Caractères (hanzi/), pas sur Prononciation. Seule la première page d'une séance
  // est redirigée : l'onglet « Prononciation », un retour en arrière ou un lien vers une ancre (#sons) restent ici.
  (function () {
    try {
      var deja = sessionStorage.getItem("chinois-ouvert");
      sessionStorage.setItem("chinois-ouvert", "1");
      var dossier = location.origin + location.pathname.replace(/[^\/]*$/, "");
      var interne = document.referrer && document.referrer.indexOf(dossier) === 0;
      if (!deja && !interne && !location.hash) location.replace("hanzi/");
    } catch (e) { /* stockage indisponible : on reste sur Prononciation */ }
  })();
  </script>
  <link rel="stylesheet" href="style.css">
</head>
